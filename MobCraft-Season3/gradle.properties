# MobCraft Season 3 alpha, Minecraft 26.3

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

mod_id=mobcraft
mod_version=5.10.0-beta
# The name on the jar file: mobcraft-season3-beta-5.10.jar
jar_version=beta-5.10
maven_group=com.reality.mobcraft
archives_base_name=mobcraft-season3

# 26.3 toolchain.
#   fabric_version 0.163.0+26.3 is the newest 26.3 build (Fabric API releases, Oct 14).
#   loader 0.19.3 and Gradle 9.6.1 already build on this machine for 26.2.
#   If Gradle can't resolve Loom 1.17-SNAPSHOT, try 1.16-SNAPSHOT.
minecraft_version=26.3
loader_version=0.19.3
fabric_version=0.163.0+26.3
loom_version=1.17-SNAPSHOT
